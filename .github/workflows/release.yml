name: Release
on:
  workflow_dispatch:
    inputs: { version: { description: Version, required: true, default: 0.1.0 } }
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: 8.0.x }
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: src/WebhookStudio.Web/package-lock.json }
      - name: Build packages
        shell: pwsh
        run: ./scripts/publish.ps1 -Version '${{ inputs.version || github.ref_name }}'.TrimStart('v')
      - uses: softprops/action-gh-release@v3
        with:
          files: |
            artifacts/*.zip
            artifacts/*.sha256
          generate_release_notes: true
