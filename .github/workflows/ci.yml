name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: 8.0.x }
      - uses: actions/setup-node@v7
        with: { node-version: 20, cache: npm, cache-dependency-path: src/WebhookStudio.Web/package-lock.json }
      - run: dotnet restore WebhookStudio.sln --configfile NuGet.Config
      - run: dotnet build WebhookStudio.sln --no-restore -c Release
      - run: dotnet test WebhookStudio.sln --no-build -c Release
      - run: dotnet format WebhookStudio.sln --no-restore --verify-no-changes
      - run: npm ci
        working-directory: src/WebhookStudio.Web
      - run: npm run format:check
        working-directory: src/WebhookStudio.Web
      - run: npm run typecheck
        working-directory: src/WebhookStudio.Web
      - run: npm test
        working-directory: src/WebhookStudio.Web
      - run: npm run build
        working-directory: src/WebhookStudio.Web
      - run: npx playwright install --with-deps chromium
        working-directory: src/WebhookStudio.Web
      - run: ./scripts/test-e2e.ps1 -NoPause
        shell: pwsh
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t webhook-studio:ci .
  publish-smoke:
    runs-on: windows-latest
    strategy:
      matrix: { rid: [win-x64, win-arm64, linux-x64, linux-arm64, osx-arm64] }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: 8.0.x }
      - uses: actions/setup-node@v7
        with: { node-version: 20, cache: npm, cache-dependency-path: src/WebhookStudio.Web/package-lock.json }
      - run: npm ci && npm run build
        working-directory: src/WebhookStudio.Web
      - run: dotnet publish src/WebhookStudio.Api -c Release -r ${{ matrix.rid }} --self-contained true -p:PublishSingleFile=true -o artifacts/${{ matrix.rid }}
      - run: if (!(Test-Path artifacts/${{ matrix.rid }}/wwwroot/index.html)) { throw 'frontend missing' }
        shell: pwsh
